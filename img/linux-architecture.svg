<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 410" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc Linux</title>
  <desc id="desc">Các lớp đồng tâm gồm Kernel ở giữa, Shell ở lớp tiếp theo, và Applications cùng Utilities ở lớp ngoài.</desc>
  <rect width="500" height="410" fill="#fff"/>
  <ellipse cx="250" cy="205" rx="238" ry="198" fill="none" stroke="#222" stroke-width="2"/>
  <ellipse cx="250" cy="205" rx="148" ry="122" fill="none" stroke="#222" stroke-width="2"/>
  <ellipse cx="250" cy="205" rx="73" ry="61" fill="none" stroke="#222" stroke-width="2"/>
  <g fill="#222" font-family="Georgia, serif" font-size="22" font-weight="bold" text-anchor="middle">
    <text x="250" y="62">Applications</text>
    <text x="250" y="126">Shell</text>
    <text x="250" y="212">Kernel</text>
    <text x="250" y="360">Utilities</text>
  </g>
</svg>
