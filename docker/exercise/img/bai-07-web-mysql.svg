<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">Bài 07: Sơ đồ Docker với web, MySQL, volume và network</title>
  <desc id="desc">Browser truy cập Nginx qua host 1510 đến container 80. Client MySQL truy cập qua host 1511 đến container 3306. Hai container được thiết kế cùng network tavantien-net. Volume tavantien-mysql-data lưu dữ liệu tại /var/lib/mysql của container MySQL.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/></marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #475569; }
      .heading { font-size: 28px; font-weight: 700; }
      .body { font-size: 25px; }
      .small { font-size: 22px; fill: #475569; }
      .label { font-size: 22px; font-weight: 600; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 24px; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#blue-arrow); }
      .sql-flow { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#teal-arrow); }
    </style>
  </defs>
  <rect width="1800" height="1240" fill="#ffffff"/>
  <text x="50" y="70" class="title">Bài 07 · Web + MySQL với Docker</text>
  <text x="50" y="112" class="subtitle">Web: 1510 → 80 · MySQL: 1511 → 3306 · Lưu dữ liệu bằng Docker volume</text>

  <rect x="360" y="170" width="1380" height="1000" rx="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="395" y="220" class="heading">Server Ubuntu · host</text>
  <rect x="650" y="270" width="1030" height="650" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="680" y="315" class="heading">Docker Engine</text>
  <rect x="700" y="350" width="930" height="510" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="735" y="395" class="heading">Docker network: tavantien-net</text>

  <rect x="40" y="410" width="260" height="155" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="170" y="455" text-anchor="middle" class="heading">User / Browser</text>
  <text x="170" y="494" text-anchor="middle" class="body">HTTP</text>
  <text x="170" y="533" text-anchor="middle" class="mono">&lt;IP-server&gt;:1510</text>
  <path d="M 300 480 H 405" class="flow"/>
  <rect x="405" y="425" width="180" height="110" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="495" y="466" text-anchor="middle" class="small">Cổng host</text>
  <text x="495" y="510" text-anchor="middle" class="heading">1510</text>
  <path d="M 585 480 H 900" class="flow"/>
  <text x="742" y="457" text-anchor="middle" class="label">1510 → 80</text>

  <rect x="900" y="425" width="600" height="145" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="930" y="467" class="heading">Web container · Nginx</text>
  <text x="930" y="507" class="mono">web-1-tavantien</text>
  <text x="930" y="545" class="small">Cổng container: 80 · phục vụ HTML tĩnh</text>

  <rect x="40" y="650" width="260" height="155" rx="18" fill="#f0fdfa" stroke="#80bbb5" stroke-width="2"/>
  <text x="170" y="695" text-anchor="middle" class="heading">Client MySQL</text>
  <text x="170" y="734" text-anchor="middle" class="body">Kết nối database</text>
  <text x="170" y="773" text-anchor="middle" class="mono">&lt;IP-server&gt;:1511</text>
  <path d="M 300 725 H 405" class="sql-flow"/>
  <rect x="405" y="670" width="180" height="110" rx="16" fill="#ffffff" stroke="#80bbb5" stroke-width="2"/>
  <text x="495" y="711" text-anchor="middle" class="small">Cổng host</text>
  <text x="495" y="755" text-anchor="middle" class="heading">1511</text>
  <path d="M 585 725 H 900" class="sql-flow"/>
  <text x="742" y="702" text-anchor="middle" class="label">1511 → 3306</text>

  <rect x="900" y="650" width="600" height="150" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="930" y="692" class="heading">Database container · MySQL</text>
  <text x="930" y="732" class="mono">tavantien_mysql</text>
  <text x="930" y="771" class="small">Cổng container: 3306 · /var/lib/mysql</text>

  <path d="M 1410 570 V 650" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <text x="1155" y="615" class="small">Cùng network</text>

  <rect x="900" y="1010" width="730" height="120" rx="18" fill="#fffbeb" stroke="#d5ac57" stroke-width="2"/>
  <text x="930" y="1052" class="heading">Docker volume · lưu dữ liệu</text>
  <text x="930" y="1094" class="mono">tavantien-mysql-data</text>
  <path d="M 1200 800 V 1010" fill="none" stroke="#a16207" stroke-width="3" marker-start="url(#amber-arrow)" marker-end="url(#amber-arrow)"/>
  <text x="1225" y="964" class="label" style="fill:#854d0e">Mount /var/lib/mysql</text>

  <text x="50" y="1210" class="small">Network tavantien-net là thiết kế đề xuất; chưa có minh chứng tạo network này trên server.</text>
</svg>
