<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Bài 06: Sơ đồ web tĩnh chạy bằng Docker</title>
  <desc id="desc">Browser truy cập cổng 1510 của server Ubuntu, Docker chuyển tiếp đến cổng 80 của container web-1-tavantien. Nginx đọc index.html từ thư mục trên host qua bind mount chỉ đọc.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#15803d"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #172033; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 23px; fill: #475569; }
      .heading { font-size: 27px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; fill: #475569; }
      .label { font-size: 21px; font-weight: 600; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 23px; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#blue-arrow); }
    </style>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="60" y="70" class="title">Bài 06 · Web tĩnh chạy bằng Docker</text>
  <text x="60" y="112" class="subtitle">HTTP qua cổng host 1510 → Nginx :80 → nội dung HTML trên host</text>

  <rect x="400" y="170" width="1140" height="710" rx="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="435" y="218" class="heading">Server Ubuntu · host</text>

  <rect x="60" y="290" width="260" height="180" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="190" y="338" text-anchor="middle" class="heading">Người dùng</text>
  <text x="190" y="375" text-anchor="middle" class="body">Browser</text>
  <text x="190" y="420" text-anchor="middle" class="mono">HTTP :1510</text>
  <path d="M 320 380 H 450" class="flow"/>
  <text x="385" y="345" text-anchor="middle" class="label">HTTP</text>

  <rect x="450" y="320" width="190" height="120" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="545" y="360" text-anchor="middle" class="small">Cổng host</text>
  <text x="545" y="405" text-anchor="middle" class="heading">1510</text>

  <rect x="710" y="260" width="780" height="310" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="740" y="303" class="heading">Docker Engine</text>
  <rect x="850" y="335" width="580" height="175" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="880" y="377" class="heading">Container Nginx · cổng 80</text>
  <text x="880" y="420" class="mono">web-1-tavantien</text>
  <text x="880" y="462" class="mono">/usr/share/nginx/html</text>
  <path d="M 640 380 H 850" class="flow"/>
  <text x="745" y="357" text-anchor="middle" class="label">1510 → 80</text>

  <rect x="450" y="670" width="980" height="155" rx="18" fill="#f0fdf4" stroke="#86b89b" stroke-width="2"/>
  <text x="480" y="713" class="heading">Thư mục web trên host</text>
  <text x="480" y="756" class="mono">~/tavantienk7/web-1/index.html</text>
  <text x="480" y="794" class="small">Nguồn nội dung trang giới thiệu</text>
  <path d="M 1140 670 V 510" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#green-arrow)"/>
  <text x="1165" y="607" class="label" style="fill:#166534">Bind mount</text>
  <text x="1165" y="638" class="small">Chỉ đọc (:ro)</text>

  <text x="60" y="920" class="body">Truy cập: http://&lt;IP-server&gt;:1510</text>
  <text x="60" y="954" class="small">Nginx trả HTML cho browser; sửa file trên host sẽ cập nhật nội dung được phục vụ.</text>
</svg>
